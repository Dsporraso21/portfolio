<div id="app"></div>
<script>
window.__errs = [];
window.addEventListener("error", function (e) {
  if (e && e.message) window.__errs.push((e.filename ? e.filename.split("/").slice(-2).join("/") + ", línea " + e.lineno + ": " : "") + e.message);
});
</script>
<noscript><p style="padding:24px">This portfolio needs JavaScript to show the projects. Contact: santiporras102@gmail.com</p></noscript>
<script src="content/site.js"></script>
<script src="content/projects.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var missing = [];
  if (!window.SITE) missing.push("content/site.js");
  if (!window.PROJECTS) missing.push("content/projects.js");
  if (!missing.length && !window.__errs.length) return;
  var box = document.createElement("div");
  box.setAttribute("role", "alert");
  box.style.cssText = "margin:24px auto;max-width:720px;padding:20px 24px;border:2px solid #d92d20;border-radius:12px;background:#fff;color:#111430;font:16px/1.5 system-ui,sans-serif";
  var h = document.createElement("strong");
  h.textContent = missing.length ? "Hay un error de escritura en " + missing.join(" y ") + "." : "Algo ha fallado al cargar la página.";
  var p = document.createElement("p");
  p.style.margin = "8px 0 0";
  p.textContent = "Suele ser una coma, una comilla o una llave que falta en lo último que has editado. " + (window.__errs.length ? "Detalle: " + window.__errs.join(" | ") : "");
  box.appendChild(h); box.appendChild(p);
  document.body.insertBefore(box, document.body.firstChild);
})();
</script>
